<!DOCTYPE html>
<html lang="fr" dir="ltr">

<head>
  <title>Fièvres du Samedi Soir</title>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="description" content="Fievres du Samedi Soir">
  <!-- Chrome, Firefox OS and Opera -->
  <meta name="theme-color" content="#000000">
  <!-- Windows Phone -->
  <meta name="msapplication-navbutton-color" content="#000000">
  <!-- iOS Safari -->
  <meta name="apple-mobile-web-app-status-bar-style" content="#000000">
  <meta name="news_keywords"
    content="fievresdusamedisoir, instagram, music, music visualization, webgl, 3d, data viz, data, data vis">

  <meta property="og:title" content="Fièvres du Samedi Soir">
  <meta property="og:description" content="Fievres du Samedi Soir ">
  <meta property="og:type" content="article">

  <meta name="twitter:creator" content="@alexlevy0">
  <style>
    @font-face {
      font-family: 'Open Sans';
      src: url('/fonts/OpenSans-Regular.woff2') format('woff2'),
        url('/fonts/OpenSans-Regular.woff') format('woff'),
        url('/fonts/OpenSans-Regular.ttf') format('truetype');
      font-display: swap;
    }

    :root {
      --ink: #ececec;
      --ink-dim: rgba(236, 236, 236, 0.55);
      --ink-faint: rgba(236, 236, 236, 0.22);
      --gutter: clamp(1rem, 3.5vw, 2.25rem);
      --tap: 44px;
      --ease-out: cubic-bezier(0.22, 1, 0.36, 1);
      --live-red: #ff3b30;
    }

    html,
    body {
      color: var(--ink);
      background-color: #000;
      font-family: 'Open Sans', system-ui, -apple-system, 'Segoe UI', sans-serif;
      -webkit-font-smoothing: antialiased;
      -webkit-text-size-adjust: 100%;
      text-size-adjust: 100%;
      margin: 0;
      padding: 0;
      height: 100%;
      overflow: hidden;
      overscroll-behavior: none;
    }

    /* the 3D controls own every gesture on the scene (no page pinch/scroll) */
    canvas.viz {
      display: block;
      touch-action: none;
      -webkit-tap-highlight-color: transparent;
    }

    /* auto-hide: no cursor while the player is hidden */
    body.ui-idle,
    body.ui-idle * {
      cursor: none !important;
    }

    /* ---------- title card ---------- */

    .title-card-container {
      position: fixed;
      inset: 0;
      z-index: 8;
    }

    .instructions {
      opacity: 0;
      transition: opacity 1000ms linear;
      position: absolute;
      top: max(5%, env(safe-area-inset-top));
      left: 0;
      right: 0;
      display: flex;
      justify-content: center;
    }

    .instructions button {
      min-width: var(--tap);
      min-height: var(--tap);
      padding: 0.25em 0.45em;
      border: 0;
      border-radius: 999px;
      background: transparent;
      color: var(--ink);
      font: inherit;
      font-size: clamp(2.25rem, 7vw, 4.25rem);
      line-height: 1;
      cursor: pointer;
      transition: background-color 150ms linear;
      -webkit-tap-highlight-color: transparent;
    }

    .instructions button:hover {
      background-color: rgba(255, 255, 255, 0.08);
    }

    .instructions button:focus-visible {
      outline: 1px solid var(--ink-dim);
      outline-offset: 4px;
    }

    /* ---------- player ---------- */

    .controls-container {
      position: fixed;
      left: 0;
      right: 0;
      bottom: 0;
      z-index: 9;
      opacity: 0;
      visibility: hidden;
      pointer-events: none;
      /* the idle fade; the first appearance uses the intro timing (JS) */
      transition: opacity 700ms ease, visibility 0s linear 700ms;
      padding: clamp(2.5rem, 9vh, 5rem) var(--gutter) max(clamp(0.5rem, 2vh, 1.25rem), env(safe-area-inset-bottom));
      padding-left: max(var(--gutter), env(safe-area-inset-left));
      padding-right: max(var(--gutter), env(safe-area-inset-right));
      background: linear-gradient(to top,
          rgba(0, 0, 0, 0.72) 0%,
          rgba(0, 0, 0, 0.45) 45%,
          rgba(0, 0, 0, 0) 100%);
      font-size: clamp(0.8125rem, 0.75rem + 0.25vw, 0.9375rem);
      line-height: 1.35;
      letter-spacing: 0.02em;
      user-select: none;
      -webkit-user-select: none;
      -webkit-tap-highlight-color: transparent;
    }

    .controls-container.is-visible {
      opacity: 1;
      visibility: visible;
      transition: opacity 250ms ease, visibility 0s;
    }

    .controls-container.is-visible:not(.is-idle) {
      pointer-events: auto;
    }

    .controls-container.is-visible.is-idle {
      opacity: 0;
      visibility: hidden;
      transition: opacity 900ms ease, visibility 0s linear 900ms;
    }

    .player {
      position: relative;
      display: grid;
      grid-template-columns: auto minmax(0, 1fr) auto auto auto auto;
      grid-template-areas:
        "seek seek seek seek seek seek"
        "play meta tracks live time link";
      align-items: center;
      column-gap: clamp(0.5rem, 2vw, 1.5rem);
      max-width: 90rem;
      margin: 0 auto;
    }

    .player button,
    .player a {
      font: inherit;
      color: inherit;
      -webkit-tap-highlight-color: transparent;
    }

    .player :focus-visible {
      outline: 1px solid var(--ink-dim);
      outline-offset: 2px;
      border-radius: 4px;
    }

    /* seek bar: a hairline with a 44px hit area */
    .seeker {
      grid-area: seek;
      position: relative;
      height: var(--tap);
      margin: 0 0 -0.25rem;
      cursor: pointer;
      touch-action: none;
    }

    .seeker-track {
      position: absolute;
      left: 0;
      right: 0;
      top: 50%;
      height: 1px;
      transform: translateY(-50%);
      background: var(--ink-faint);
      transition: height 150ms ease;
    }

    .seeker:hover .seeker-track,
    .seeker.is-dragging .seeker-track,
    .seeker:focus-visible .seeker-track {
      height: 3px;
    }

    .seeker:focus-visible {
      outline: none;
    }

    .progress {
      position: absolute;
      top: 0;
      bottom: 0;
      left: 0;
      width: 100%;
      background: var(--ink);
      transform-origin: 0 50%;
      transform: scaleX(0);
    }

    .seeker-thumb {
      position: absolute;
      top: 50%;
      left: 0;
      width: 9px;
      height: 9px;
      margin: -4.5px 0 0 -4.5px;
      border-radius: 50%;
      background: var(--ink);
      opacity: 0;
      transition: opacity 150ms ease;
      pointer-events: none;
    }

    .seeker:hover .seeker-thumb,
    .seeker.is-dragging .seeker-thumb,
    .seeker:focus-visible .seeker-thumb {
      opacity: 1;
    }

    .play-pause {
      grid-area: play;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: var(--tap);
      height: var(--tap);
      margin-left: -10px;
      padding: 0;
      border: 0;
      border-radius: 50%;
      background: transparent;
      cursor: pointer;
      transition: background-color 150ms ease;
    }

    .play-pause:hover {
      background: rgba(255, 255, 255, 0.08);
    }

    .play-pause svg {
      width: 18px;
      height: 18px;
      fill: currentColor;
    }

    .play-pause .icon-pause,
    .play-pause .icon-stop,
    .play-pause.is-playing .icon-play {
      display: none;
    }

    .play-pause.is-playing .icon-pause {
      display: block;
    }

    .is-live .play-pause.is-playing .icon-pause {
      display: none;
    }

    .is-live .play-pause.is-playing .icon-stop {
      display: block;
    }

    .now-playing {
      grid-area: meta;
      min-width: 0;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .now-playing .title {
      display: inline;
      font-size: 1.15em;
    }

    .now-playing .artist {
      display: inline;
      margin-left: 0.75em;
      font-size: 0.78em;
      letter-spacing: 0.16em;
      text-transform: uppercase;
      color: var(--ink-dim);
    }

    .track-selector {
      grid-area: tracks;
      display: flex;
      gap: 0.125rem;
      margin: 0;
      padding: 0;
      list-style: none;
    }

    .track button {
      min-width: var(--tap);
      min-height: var(--tap);
      padding: 0 0.6em;
      border: 0;
      border-radius: 999px;
      background: transparent;
      color: var(--ink-dim);
      cursor: pointer;
      font-variant-numeric: tabular-nums;
      transition: color 200ms ease, background-color 200ms ease;
    }

    .track button:hover {
      color: var(--ink);
    }

    .track.selected button {
      color: var(--ink);
      background: rgba(255, 255, 255, 0.08);
    }

    .elapsed-time {
      grid-area: time;
      color: var(--ink-dim);
      font-variant-numeric: tabular-nums;
      white-space: nowrap;
    }

    .elapsed-time .current {
      color: var(--ink);
    }

    .instagram-link {
      grid-area: link;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: var(--tap);
      height: var(--tap);
      margin-right: -10px;
      border-radius: 50%;
      font-size: 1.25rem;
      line-height: 1;
      text-decoration: none;
      opacity: 0.45;
      filter: grayscale(1);
      transition: opacity 200ms ease, filter 200ms ease;
    }

    .instagram-link:hover,
    .instagram-link:focus-visible {
      opacity: 1;
      filter: none;
    }

    /* ---------- live input ---------- */

    .live {
      grid-area: live;
      position: relative;
      display: flex;
      align-items: center;
      gap: 0.25rem;
    }

    .live[hidden] {
      display: none;
    }

    .live-toggle,
    .live-menu button {
      min-height: var(--tap);
      padding: 0 0.7em;
      border: 0;
      border-radius: 999px;
      background: transparent;
      color: var(--ink-dim);
      cursor: pointer;
      font-size: 0.78em;
      letter-spacing: 0.16em;
      text-transform: uppercase;
      white-space: nowrap;
      transition: color 200ms ease, background-color 200ms ease, opacity 200ms ease;
    }

    .live-toggle:hover,
    .live-toggle[aria-expanded="true"],
    .live-menu button:hover {
      color: var(--ink);
      background: rgba(255, 255, 255, 0.08);
    }

    .live-toggle[aria-pressed="true"] {
      color: var(--live-red);
    }

    .live-toggle.is-pending {
      opacity: 0.5;
      cursor: progress;
    }

    .live-menu {
      position: absolute;
      right: 0;
      bottom: calc(100% + 0.25rem);
      display: flex;
      flex-direction: column;
      padding: 0.25rem;
      border-radius: 12px;
      background: rgba(0, 0, 0, 0.82);
      box-shadow: 0 0 0 1px var(--ink-faint);
    }

    .live-menu[hidden],
    .live-menu button[hidden],
    .live-device[hidden] {
      display: none;
    }

    .live-menu button {
      text-align: left;
      border-radius: 8px;
      letter-spacing: 0.08em;
    }

    .live-device {
      max-width: 11rem;
      min-height: 2rem;
      padding: 0 0.4em;
      border: 0;
      border-radius: 6px;
      background: rgba(255, 255, 255, 0.08);
      color: var(--ink);
      font: inherit;
      font-size: 0.8em;
    }

    .live-device option {
      background: #000;
    }

    .live-dot {
      display: none;
      width: 0.5em;
      height: 0.5em;
      margin-right: 0.6em;
      vertical-align: 0.12em;
      border-radius: 50%;
      background: var(--live-red);
      animation: live-pulse 1.6s ease-in-out infinite;
    }

    .is-live .live-dot {
      display: inline-block;
    }

    @keyframes live-pulse {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.25; }
    }

    /* no position in a live input; the mixes stay there to go back */
    .is-live .seeker,
    .is-live .elapsed-time {
      visibility: hidden;
    }

    .is-live .track.selected button {
      color: var(--ink-dim);
      background: transparent;
    }

    /* sits in the transparent top of the gradient: its own backing keeps it
       readable over bright visuals */
    .live-message {
      position: absolute;
      left: 0;
      right: 0;
      bottom: calc(100% + 0.5rem);
      display: block;
      width: fit-content;
      max-width: 100%;
      margin: 0 auto;
      padding: 0.35em 0.8em;
      border-radius: 999px;
      background: rgba(0, 0, 0, 0.72);
      text-align: center;
      color: var(--ink);
      opacity: 0;
      transition: opacity 600ms ease;
      pointer-events: none;
    }

    .live-message.is-shown {
      opacity: 1;
      transition-duration: 200ms;
    }

    /* phones: tracks on their own line below, the live controls at its
       right end. Both share the full-width "tracks" area so a wide device
       picker never widens the time / link columns (and crushes the title) */
    @media (max-width: 40rem) {
      .player {
        grid-template-columns: auto minmax(0, 1fr) auto auto;
        grid-template-areas:
          "seek seek seek seek"
          "play meta time link"
          "tracks tracks tracks tracks";
      }

      .live {
        grid-area: tracks;
        justify-self: end;
        justify-content: flex-end;
        min-width: 0;
      }

      .live-device {
        max-width: 7rem;
      }

      .now-playing .artist {
        display: block;
        margin-left: 0;
      }

      .track-selector {
        justify-self: start;
        margin-left: -0.6em;
      }
    }

    /* ---------- tweak panel (hidden; toggled with G) ---------- */

    .lil-gui.root,
    .lil-gui.root.autoPlace {
      --width: min(17.5rem, calc(100vw - 2rem));
      --font-size: 11px;
      --input-font-size: 11px;
      --widget-height: 20px;
      --padding: 4px;
      --spacing: 4px;
      position: fixed;
      top: max(0.75rem, env(safe-area-inset-top));
      right: max(0.75rem, env(safe-area-inset-right));
      max-height: calc(100% - 1.5rem - 9rem);
      overflow-y: auto;
      z-index: 11;
      border-radius: 6px;
    }

    @media (prefers-reduced-motion: reduce) {

      .instructions,
      .controls-container,
      .controls-container.is-visible,
      .controls-container.is-visible.is-idle,
      .seeker-track,
      .seeker-thumb,
      .live-message {
        transition: none !important;
      }

      .live-dot {
        animation: none;
      }
    }
  </style>

  <script async src="https://www.googletagmanager.com/gtag/js?id=G-67M4RNKP2Q"></script>
  <script>
    window.dataLayer = window.dataLayer || [];

  </script>
</head>

<body>
  <canvas class="viz" aria-label="Visualisation audio réactive" role="img"></canvas>
  <div class="title-card-container">
    <canvas aria-hidden="true"></canvas>
    <div class="instructions">
      <button type="button" aria-label="Lancer la musique">🔊</button>
    </div>
  </div>
  <section class="controls-container" aria-label="Lecteur audio">
    <div class="player">
      <div class="seeker" role="slider" tabindex="0" aria-label="Position dans le morceau"
        aria-valuemin="0" aria-valuemax="0" aria-valuenow="0" aria-valuetext="0:00">
        <div class="seeker-track">
          <div class="progress"></div>
        </div>
        <div class="seeker-thumb"></div>
      </div>
      <button type="button" class="play-pause" aria-label="Lecture">
        <svg class="icon-play" viewBox="0 0 18 18" aria-hidden="true">
          <path d="M5 3.2v11.6c0 .6.6.9 1.1.6l9.2-5.8c.5-.3.5-.9 0-1.2L6.1 2.6C5.6 2.3 5 2.6 5 3.2z" />
        </svg>
        <svg class="icon-pause" viewBox="0 0 18 18" aria-hidden="true">
          <rect x="4" y="3" width="3.2" height="12" rx="0.8" />
          <rect x="10.8" y="3" width="3.2" height="12" rx="0.8" />
        </svg>
        <svg class="icon-stop" viewBox="0 0 18 18" aria-hidden="true">
          <rect x="4" y="4" width="10" height="10" rx="1.2" />
        </svg>
      </button>
      <div class="now-playing" aria-live="polite">
        <span class="live-dot" aria-hidden="true"></span>
        <span class="title"></span>
        <span class="artist"></span>
      </div>
      <ol class="track-selector" aria-label="Mixes"></ol>
      <div class="live" hidden>
        <button type="button" class="live-toggle" aria-haspopup="true" aria-expanded="false"
          aria-pressed="false" aria-label="Entrée live (L)">live</button>
        <div class="live-menu" hidden>
          <button type="button" data-live="mic">Micro</button>
          <button type="button" data-live="display">Onglet ou écran</button>
        </div>
        <select class="live-device" aria-label="Entrée audio" hidden></select>
      </div>
      <div class="elapsed-time" aria-label="Temps écoulé et durée totale">
        <span class="current">0:00</span> / <span class="total">0:00</span>
      </div>
      <a href="https://www.instagram.com/alexlevy0/" target="_blank" rel="noopener" class="instagram-link"
        aria-label="Instagram (nouvel onglet)">🕴</a>
      <div class="live-message" role="status" aria-live="polite"></div>
    </div>
  </section>
  <script type="module" src="/src/index.js"></script>
</body>

</html>
